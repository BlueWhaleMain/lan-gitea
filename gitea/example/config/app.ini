[server]
SSH_PORT = 22
SSH_LISTEN_PORT = 2222

[security]
REVERSE_PROXY_LIMIT = 1
REVERSE_PROXY_TRUSTED_PROXIES = 127.0.0.0/8,::1/128

; clone timed out, consider increasing [git.timeout] MIGRATE in app.ini, underlying err: context deadline exceeded
[git.timeout]
MIRROR = 21600
MIGRATE = 21600
DEFAULT = 21600

[migrations]
MAX_ATTEMPTS = 5
RETRY_BACKOFF = 30
ALLOWED_HOST_LIST = github.com

[git]
; signal: terminated - fetch-pack: unexpected disconnect while reading sideband packet
GLOBAL_CMD_ARGS = -c http.lowSpeedLimit=1 -c http.lowSpeedTime=3600 -c http.postBuffer=524288000
; curl 92 HTTP/2 stream 5 reset by server (error 0x8 CANCEL)
; -c http.version=HTTP/1.1

[proxy]
PROXY_ENABLED = true
PROXY_HOSTS = *.gitea.io,*.github.com

[audit]
RECORD_OUTPUT = database
